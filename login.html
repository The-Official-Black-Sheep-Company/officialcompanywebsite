<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Access | Black Sheep Company</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        .login-box {
            background: rgba(16, 16, 16, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .input-field {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #d4d4d4;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
            outline: none;
        }

        .btn-glow {
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.3), transparent);
            animation: scan 4s linear infinite;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: -10%;
            }

            100% {
                top: 110%;
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen text-gray-200">

    <!-- Background effects -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div
            class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] opacity-30">
        </div>
        <div class="scan-line"></div>
    </div>

    <div class="login-box relative z-10 p-8 rounded-lg w-full max-w-md mx-4 transition-all duration-500"
        id="auth-container">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <h1
                class="text-3xl font-bold font-['Orbitron'] text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-400 mb-2">
                MEMBERS PORTAL</h1>
            <p id="portal-subtitle" class="text-gray-500 text-[10px] uppercase tracking-[0.3em]">Restricted Access
                Protocol</p>
        </div>

        <!-- VIEW 1: GATE/CHOICE -->
        <div id="view-choice" class="space-y-6 animate-fade-in">
            <button onclick="showView('login')"
                class="btn-glow w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold py-4 rounded font-['Orbitron'] tracking-wider flex items-center justify-center gap-3 text-lg border border-violet-400/20">
                LOGIN WITH BLACKSHEEP ID
            </button>
            <button onclick="showView('signup')"
                class="w-full border border-violet-500/30 text-violet-400 py-4 rounded font-['Orbitron'] tracking-widest text-sm hover:bg-violet-500/10 transition-all duration-300">
                SIGN UP FOR MEMBERS ACCOUNT
            </button>

            <div class="mt-8 text-center border-t border-white/5 pt-6">
                <a href="index.html"
                    class="text-xs text-gray-600 hover:text-gray-100 transition-colors tracking-widest uppercase flex items-center justify-center gap-2">
                    &lsaquo; Return to Surface
                </a>
            </div>
        </div>

        <!-- VIEW 2: LOGIN FORM -->
        <div id="view-login" class="hidden space-y-6 animate-fade-in">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">Username or
                        Email</label>
                    <input type="text" id="login-id"
                        class="input-field w-full px-4 py-3 rounded text-sm placeholder-gray-700"
                        placeholder="Identity Handle">
                </div>
                <div>
                    <label
                        class="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">Password</label>
                    <input type="password" id="login-pass"
                        class="input-field w-full px-4 py-3 rounded text-sm placeholder-gray-700"
                        placeholder="••••••••">
                </div>
                <button onclick="triggerKeycloakLogin()"
                    class="btn-glow w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold py-3 rounded font-['Orbitron'] tracking-wide">
                    AUTHORIZE ACCESS
                </button>
            </div>

            <div class="relative py-2">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white/5"></div>
                </div>
                <div class="relative flex justify-center text-[10px] uppercase tracking-widest"><span
                        class="bg-[#101010] px-2 text-gray-600">or external id</span></div>
            </div>

            <button onclick="triggerSocialAuth('google')"
                class="w-full border border-white/10 text-gray-300 py-3 rounded text-xs hover:bg-white/5 transition-all flex items-center justify-center gap-2">
                <img src="https://www.google.com/favicon.ico" class="w-4 h-4 rounded-full grayscale opacity-70">
                Continue with Google Account
            </button>

            <button onclick="showView('choice')"
                class="w-full text-[10px] text-gray-600 hover:text-gray-400 uppercase tracking-widest pt-2">
                &lsaquo; Back to Gate
            </button>
        </div>

        <!-- VIEW 3: SIGNUP FORM -->
        <div id="view-signup" class="hidden space-y-6 animate-fade-in">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">Full
                        Identity Name</label>
                    <input type="text" id="reg-username"
                        class="input-field w-full px-4 py-2.5 rounded text-sm placeholder-gray-700"
                        placeholder="Username">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">Email
                        Address</label>
                    <input type="email" id="reg-email"
                        class="input-field w-full px-4 py-2.5 rounded text-sm placeholder-gray-700"
                        placeholder="email@example.com">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">New
                        Password</label>
                    <input type="password" id="reg-pass"
                        class="input-field w-full px-4 py-2.5 rounded text-sm placeholder-gray-700"
                        placeholder="Min. 8 characters">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">Verify
                        Password</label>
                    <input type="password" id="reg-verify"
                        class="input-field w-full px-4 py-2.5 rounded text-sm placeholder-gray-700"
                        placeholder="Confirm selection">
                </div>
                <button onclick="triggerKeycloakRegister()"
                    class="btn-glow w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold py-3 rounded font-['Orbitron'] tracking-wide">
                    INITIALIZE MEMBERSHIP
                </button>
            </div>

            <div class="relative py-2">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white/5"></div>
                </div>
                <div class="relative flex justify-center text-[10px] uppercase tracking-widest"><span
                        class="bg-[#101010] px-2 text-gray-600">or social link</span></div>
            </div>

            <button onclick="triggerSocialAuth('google')"
                class="w-full border border-white/10 text-gray-300 py-3 rounded text-xs hover:bg-white/5 transition-all flex items-center justify-center gap-2">
                <img src="https://www.google.com/favicon.ico" class="w-4 h-4 rounded-full grayscale opacity-70">
                Sign up with Google Account
            </button>

            <button onclick="showView('choice')"
                class="w-full text-[10px] text-gray-600 hover:text-gray-400 uppercase tracking-widest pt-2">
                &lsaquo; Back to Gate
            </button>
        </div>
    </div>

    <!-- Keycloak Integration -->
    <script src="http://172.234.229.103:9999/js/keycloak.js"></script>
    <script>
        const keycloak = new Keycloak({
            url: 'http://172.234.229.103:9999',
            realm: 'TOBSCo',
            clientId: 'portal-client'
        });

        keycloak.init({ onLoad: 'check-sso' }).then(authenticated => {
            if (authenticated) {
                window.location.href = 'portal.html';
            }
        });

        function showView(viewId) {
            const views = ['choice', 'login', 'signup'];
            views.forEach(v => {
                const el = document.getElementById('view-' + v);
                if (v === viewId) {
                    el.classList.remove('hidden');
                    el.classList.add('animate-fade-in');
                } else {
                    el.classList.add('hidden');
                }
            });

            // Update subtitle tracking
            const subtitles = {
                'choice': 'Restricted Access Protocol',
                'login': 'Identity Verification Required',
                'signup': 'New Member Registration'
            };
            document.getElementById('portal-subtitle').textContent = subtitles[viewId] || 'Access Denied';
        }

        // Logic for triggering actual Keycloak redirection
        async function triggerKeycloakLogin() {
            const username = document.getElementById('login-id').value;
            const password = document.getElementById('login-pass').value;

            if (!username || !password) {
                alert("Please enter credentials.");
                return;
            }

            // Attempt Direct Grant Login to validate credentials
            // If this fails (401), we redirect to login_failure.html
            // Note: Direct Grant must be enabled in Keycloak Client Settings.

            const tokenUrl = 'http://172.234.229.103:9999/realms/TOBSCo/protocol/openid-connect/token';
            const params = new URLSearchParams();
            params.append('client_id', 'portal-client');
            params.append('grant_type', 'password');
            params.append('username', username);
            params.append('password', password);
            // If client secret is needed, append it here (e.g. public client usually doesn't need it)

            try {
                const response = await fetch(tokenUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: params
                });

                if (response.ok) {
                    const data = await response.json();
                    // Login success - perform standard redirect login to set cookie session
                    // OR just use the token. For consistency with the app flow, we might just call login()
                    // passing the hint, but keycloak.login() wipes state.
                    // Simplest: Redirect to portal. But we need the SSO session.
                    // Let's trigger the standard flow now that we know they likely have an account.
                    // OR just simulate success redirect.
                    window.location.href = 'portal.html';
                } else {
                    // Login failed
                    window.location.href = 'login_failure.html';
                }
            } catch (error) {
                console.error("Login attempt error:", error);
                // On network error or other issues, maybe also fail
                window.location.href = 'login_failure.html';
            }
        }

        function triggerKeycloakRegister() {
            keycloak.register();
        }

        function triggerSocialAuth(provider) {
            // Trigger social login flow in Keycloak
            keycloak.login({
                idpHint: provider
            });
        }
    </script>

    <style>
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body>

</html>
