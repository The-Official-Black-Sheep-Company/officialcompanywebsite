<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Access | Black Sheep Company</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        .login-box {
            background: rgba(16, 16, 16, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .input-field {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #d4d4d4;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
            outline: none;
        }

        .btn-glow {
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.3), transparent);
            animation: scan 4s linear infinite;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: -10%;
            }

            100% {
                top: 110%;
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen text-gray-200">

    <!-- Background effects -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div
            class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] opacity-30">
        </div>
        <div class="scan-line"></div>
    </div>

    <div class="login-box relative z-10 p-8 rounded-lg w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1
                class="text-3xl font-bold font-['Orbitron'] text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-400 mb-2">
                MEMBERS PORTAL</h1>
            <p class="text-gray-500 text-sm tracking-wider">RESTRICTED ACCESS</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-widest">Identity</label>
                <input type="text" class="input-field w-full px-4 py-3 rounded text-sm" placeholder="Username or Handle"
                    required>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-widest">Key</label>
                <input type="password" class="input-field w-full px-4 py-3 rounded text-sm" placeholder="••••••••"
                    required>
            </div>

            <button type="submit"
                class="btn-glow w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold py-3 rounded font-['Orbitron'] tracking-wide">
                AUTHENTICATE
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-gray-600 hover:text-gray-400 transition-colors">Return to
                Surface</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            // Simulating authentication
            const btn = this.querySelector('button');
            const originalText = btn.textContent;

            btn.textContent = 'VERIFYING...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            setTimeout(() => {
                btn.textContent = 'ACCESS GRANTED';
                btn.classList.remove('from-violet-600', 'to-fuchsia-600');
                btn.classList.add('from-emerald-500', 'to-green-500');

                setTimeout(() => {
                    window.location.href = 'portal.html';
                }, 800);
            }, 1200);
        });
    </script>
</body>

</html>
