stages:
  - deploy

pages:
  stage: deploy
  image: alpine:latest
  script:
    # 1. Create a temporary deployment directory
    - mkdir -p deploy_public
    # 2. Copy the contents of our 'public' folder into it
    - if [ -d "public" ]; then cp -rn public/* deploy_public/; fi
    # 3. Copy root-level assets that should be in the deployment
    - cp few-verses.txt deploy_public/ || true
    - cp chatwoot-widget-config.js deploy_public/ || true
    - if [ -d "api" ]; then cp -rn api deploy_public/; fi
    # 4. Ensure CSS has the latest adminlandingpage.css if it's in root
    - if [ -f "adminlandingpage.css" ]; then cp adminlandingpage.css deploy_public/css/ || true; fi
    # 5. Clean up the 'public' folder and replace it with our deployment bundle
    - rm -rf public
    - mv deploy_public public
  artifacts:
    paths:
      - public
  only:
    - main
