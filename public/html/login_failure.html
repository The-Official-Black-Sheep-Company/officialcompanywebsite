<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | Black Sheep Company</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        .login-box {
            background: rgba(16, 16, 16, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
        }

        .btn-glow {
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(239, 68, 68, 0.3), transparent);
            animation: scan 4s linear infinite;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: -10%;
            }

            100% {
                top: 110%;
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen text-gray-200">

    <!-- Background effects -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div
            class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] opacity-30">
        </div>
        <div class="scan-line"></div>
    </div>

    <div class="login-box relative z-10 p-8 rounded-lg w-full max-w-md mx-4 transition-all duration-500">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1
                class="text-3xl font-bold font-['Orbitron'] text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500 mb-2">
                ACCESS DENIED
            </h1>
            <p class="text-red-500 text-[10px] uppercase tracking-[0.3em]">Authentication Failed</p>
        </div>

        <!-- content -->
        <div class="space-y-6">
            <div class="text-center space-y-4">
                <p class="text-gray-400 text-sm">
                    Try a new username or password... or signup for a new members account.
                </p>
            </div>

            <div class="flex flex-col gap-3 pt-4">
                <a href="signup.html"
                    class="btn-glow w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold py-3 rounded font-['Orbitron'] tracking-wide text-center">
                    SIGN UP FOR MEMBERS ACCOUNT
                </a>

                <a href="login.html"
                    class="w-full border border-white/10 text-gray-300 py-3 rounded text-xs hover:bg-white/5 transition-all text-center uppercase tracking-widest">
                    Try Login Again
                </a>
            </div>

            <div class="mt-8 text-center border-t border-white/5 pt-6">
                <a href="../index.html"
                    class="text-xs text-gray-600 hover:text-gray-100 transition-colors tracking-widest uppercase flex items-center justify-center gap-2">
                    &lsaquo; Return to Surface
                </a>
            </div>
        </div>
    </div>
</body>

</html>
