
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Black Sheep Company - Members Portal">
    <title>TBS Portal | Members Dashboard</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/portal.css">
</head>

<body class="grid-bg">

    <div class="flex h-screen">

        <!-- SIDEBAR (Desktop) -->
        <aside class="sidebar sidebar-desktop w-64 flex flex-col flex-shrink-0">
            <!-- Logo -->
            <div class="h-16 flex items-center px-6 border-b border-[rgba(212,175,55,0.2)]">
                <a href="../index.html" class="flex items-center gap-2 no-underline">
                    <span class="text-lg font-bold font-['Orbitron'] text-white tracking-wider">TOBSCo</span>

                    <span class="text-sm text-[#f97316]">PORTAL</span>
                </a>
            </div>

            <!-- User Section (Top) -->
            <div id="user-info-sidebar" class="p-4 border-b border-[rgba(212,175,55,0.2)]">
                <!-- This will be populated by Firebase auth state -->
            </div>

            <!-- Navigation -->
            <nav class="flex-1 overflow-y-auto py-4">
                <div class="px-4 mb-2">
                    <span class="text-xs text-gray-500 uppercase tracking-widest">Main Menu</span>
                </div>
                <a href="#" class="nav-item active" data-section="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i>
                    Dashboard
                </a>
                <a href="#" class="nav-item" data-section="messages">
                    <i data-lucide="mail" class="w-5 h-5 mr-3"></i>
                    Messages
                </a>
                <a href="#" class="nav-item" data-section="profile">
                    <i data-lucide="user" class="w-5 h-5 mr-3"></i>
                    Profile
                </a>
                <a href="#" class="nav-item" data-section="feeds">
                    <i data-lucide="rss" class="w-5 h-5 mr-3"></i>
                    Feeds
                </a>
                <a href="#" class="nav-item" data-section="friends">
                    <i data-lucide="users" class="w-5 h-5 mr-3"></i>
                    Friends
                </a>
                <a href="#" class="nav-item" data-section="photobooth">
                    <i data-lucide="camera" class="w-5 h-5 mr-3"></i>
                    Photobooth
                </a>
                <a href="#" class="nav-item" data-section="billing">
                    <i data-lucide="credit-card" class="w-5 h-5 mr-3"></i>
                    Billing
                </a>
                <a href="#" class="nav-item" data-section="support">
                    <i data-lucide="help-circle" class="w-5 h-5 mr-3"></i>
                    Support
                </a>
                <a href="#" class="nav-item" data-section="activity">
                    <i data-lucide="activity" class="w-5 h-5 mr-3"></i>
                    Activity
                </a>

                <!-- Settings with Submenu -->
                <div class="settings-nav-group">
                    <a href="#" class="nav-item" data-section="settings" id="settings-nav-item">
                        <i data-lucide="settings" class="w-5 h-5 mr-3"></i>
                        Settings
                        <i data-lucide="chevron-down" class="w-4 h-4 chevron-icon"></i>
                    </a>
                    <div class="submenu" id="settings-submenu">
                        <a href="#" class="submenu-item" onclick="openNotifications(); return false;">
                            Notifications
                        </a>
                        <a href="#" class="submenu-item"
                            onclick="scrollToSettingsCard('social-integrations-card'); return false;">
                            API Keys
                        </a>
                        <a href="#" class="submenu-item"
                            onclick="scrollToSettingsCard('customization-card'); return false;">
                            Preferences
                        </a>
                        <a href="#" id="logout-button" class="submenu-item">
                            Logout
                        </a>
                    </div>
                </div>

                <div class="px-4 mt-6 mb-2">
                    <span class="text-xs text-gray-500 uppercase tracking-widest">Quick Links</span>
                </div>
                <a href="../index.html" class="nav-item">
                    <i data-lucide="home" class="w-5 h-5 mr-3"></i>
                    Main Site
                </a>
                <a href="../store.html" class="nav-item">
                    <i data-lucide="shopping-bag" class="w-5 h-5 mr-3"></i>
                    Store
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col overflow-hidden">

            <!-- Mobile Header -->
            <div
                class="mobile-header h-14 flex items-center justify-between px-4 border-b border-[rgba(212,175,55,0.2)] bg-[rgba(10,10,10,0.98)]">
                <div class="flex items-center gap-2">
                    <button id="mobile-menu-btn" class="p-2 rounded-lg text-gray-400 hover:bg-white/10" aria-label="Toggle menu">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <a href="../index.html" class="font-['Orbitron'] font-bold text-white text-sm">TBS PORTAL</a>
                </div>
                <div class="flex items-center gap-2">
                    <button class="p-2 rounded-lg text-orange-500 hover:text-white hover:bg-white/10 relative"
                        onclick="openNotifications()" aria-label="Notifications">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span
                            class="absolute top-2 right-2 w-1.5 h-1.5 bg-red-500 rounded-full border border-black"></span>
                    </button>
                    <button class="p-2 rounded-lg text-orange-500 hover:text-white hover:bg-white/10"
                        onclick="document.querySelector('.nav-item[data-section=\'settings\']').click()" aria-label="Settings">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Top Bar -->
            <header
                class="h-16 flex items-center justify-between px-6 border-b border-[rgba(212,175,55,0.2)] bg-[rgba(10,10,10,0.5)] flex-shrink-0">
                <div>
                    <h1 id="section-title" class="text-xl font-semibold text-white font-['Orbitron']">Dashboard</h1>
                    <p id="header-welcome" class="text-sm text-gray-500">Welcome back! Here's your overview.</p>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Notification Bell -->
                    <button
                        class="p-2 rounded-lg text-orange-500 hover:text-white hover:bg-white/10 relative transition-all duration-200 group"
                        id="notifications-btn" onclick="openNotifications()" aria-label="Notifications">
                        <i data-lucide="bell" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
                        <span
                            class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-[#050505]"></span>
                    </button>
                    <!-- Settings Sprocket -->
                    <button
                        class="p-2 rounded-lg text-orange-500 hover:text-white hover:bg-white/10 transition-all duration-200 group"
                        id="settings-sprocket"
                        onclick="document.querySelector('.nav-item[data-section=\'settings\']').click()" aria-label="Settings">
                        <i data-lucide="settings"
                            class="w-6 h-6 group-hover:rotate-90 transition-transform duration-500"></i>
                    </button>
                </div>
            </header>

            <!-- Content Area -->
            <div id="main-content-area" class="flex-1 overflow-y-auto p-6">
                <!-- Content sections will be dynamically loaded here -->
            </div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    
    <script>
        // auth is already initialized in firebase-config.js and available globally
        const sidebarUserSection = document.getElementById('user-info-sidebar');
        const welcomeName = document.getElementById('welcome-name');
        const headerWelcome = document.getElementById('header-welcome');
        const logoutButton = document.getElementById('logout-button');

        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is signed in
                console.log('Authenticated user:', user);
                const displayName = user.displayName || user.email.split('@')[0];
                const email = user.email;
                const photoURL = user.photoURL;

                // Update sidebar
                sidebarUserSection.innerHTML = `
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-orange-500 to-yellow-500 flex items-center justify-center text-black font-bold">
                            ${photoURL ? `<img src="${photoURL}" class="rounded-full">` : displayName.charAt(0).toUpperCase()}
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-medium text-white">${displayName}</p>
                            <p class="text-xs text-gray-500">${email}</p>
                        </div>
                    </div>
                `;

                // Update header
                if(welcomeName) welcomeName.textContent = displayName;
                 if (headerWelcome) {
                        headerWelcome.innerHTML = `Welcome back, <span class="text-orange-400 font-bold">${displayName}</span>!`;
                    }
            } else {
                // User is signed out
                console.log('User is not authenticated');
                window.location.href = '../index.html'; // Redirect to login page
            }
        });

        logoutButton.addEventListener('click', () => {
            auth.signOut().then(() => {
                console.log('User signed out');
                window.location.href = '../index.html';
            }).catch((error) => {
                console.error('Sign out error', error);
            });
        });

        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
    
    <script src="../js/portal.js"></script>

</body>

</html>
