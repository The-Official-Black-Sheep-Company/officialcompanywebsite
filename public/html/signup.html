<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Flock | Black Sheep Company</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/main.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        .login-box {
            background: rgba(16, 16, 16, 0.8);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .input-field {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #d4d4d4;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
            outline: none;
        }

        .btn-glow {
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.3), transparent);
            animation: scan 4s linear infinite;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: -10%;
            }

            100% {
                top: 110%;
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen text-gray-200">

    <!-- Background effects -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div
            class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] opacity-30">
        </div>
        <div class="scan-line"></div>
    </div>

    <div class="login-box relative z-10 p-8 rounded-lg w-full max-w-md mx-4 transition-all duration-500">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <h1
                class="text-3xl font-bold font-['Orbitron'] text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-400 mb-2">
                NEW RECRUIT
            </h1>
            <p class="text-gray-500 text-[10px] uppercase tracking-[0.3em]">Initialize Membership Protocol</p>
        </div>

        <!-- Sign-up Form -->
        <form id="signup-form" class="space-y-4">
            <input type="email" id="signup-email" placeholder="Email" class="input-field w-full px-4 py-3 rounded text-sm placeholder-gray-700" required>
            <div class="relative">
                <input type="password" id="signup-password" placeholder="Password" class="input-field w-full px-4 py-3 rounded text-sm placeholder-gray-700 pr-10" required>
                <button type="button" id="toggle-password" class="absolute right-3 top-3 text-gray-500 hover:text-violet-400 transition-colors" title="Toggle Password Visibility" aria-label="Toggle Password Visibility">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            
            <button type="submit"
                class="btn-glow w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold py-4 rounded font-['Orbitron'] tracking-wider flex items-center justify-center gap-3 text-lg border border-violet-400/20">
                SIGN UP
            </button>
        </form>

        <div class="relative py-2">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-white/5"></div>
            </div>
            <div class="relative flex justify-center text-[10px] uppercase tracking-widest"><span
                    class="bg-[#101010] px-2 text-gray-600">or</span></div>
        </div>

        <button id="google-signin-button"
            class="w-full border border-white/10 text-gray-300 py-3 rounded text-xs hover:bg-white/5 transition-all flex items-center justify-center gap-2">
            <img src="https://www.google.com/favicon.ico" class="w-4 h-4 rounded-full grayscale opacity-70" alt="">
            Sign up with Google
        </button>

        <div class="mt-4 text-center text-xs text-gray-500">
            By creating an account, you agree to our 
            <a href="#" onclick="openLegalPopup(); return false;" class="text-violet-400 hover:underline">Terms of Service and Privacy Policy</a>.
        </div>

        <div class="relative py-2">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-white/5"></div>
            </div>
            <div class="relative flex justify-center text-[10px] uppercase tracking-widest"><span
                    class="bg-[#101010] px-2 text-gray-600">Existing Identity?</span></div>
        </div>

        <!-- Option 3: Login -->
        <a href="login.html"
            class="block w-full text-center border border-violet-500/30 text-violet-400 py-3 rounded font-['Orbitron'] tracking-widest text-sm hover:bg-violet-500/10 transition-all duration-300">
            ALREADY HAVE AN ACCOUNT? LOGIN!
        </a>

        <div class="mt-8 text-center border-t border-white/5 pt-6">
            <a href="../index.html"
                class="text-xs text-gray-600 hover:text-gray-100 transition-colors tracking-widest uppercase flex items-center justify-center gap-2">
                &lsaquo; Return to Surface
            </a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config & Auth Logic -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        function openLegalPopup() {
            window.open("legal.html", "Legal", "width=800,height=600,scrollbars=yes,resizable=yes");
        }
    </script>

</body>

</html>
