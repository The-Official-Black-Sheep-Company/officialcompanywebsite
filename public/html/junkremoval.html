<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Official Black Sheep Company | Futuristic Junk Removal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Rajdhani', sans-serif; 
            overflow-x: hidden; 
            background-color: #050505; 
            color: white; 
            margin: 0;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        .gradient-text {
            background: linear-gradient(135deg, #ff00cc, #3333ff, #00ccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: hue-rotate 5s infinite linear;
        }

        .gradient-bg-animate {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes hue-rotate {
            from { filter: hue-rotate(0deg); }
            to { filter: hue-rotate(360deg); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Smooth scrolling container */
        html { scroll-behavior: smooth; }

        .junk-item { will-change: transform, opacity; }
        
        /* Custom Cursor */
        .cursor-dot {
            width: 20px;
            height: 20px;
            background: #00ccff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="cursor-dot hidden md:block"></div>

    <script type="text/babel">
        const { useEffect, useRef, useState } = React;

        gsap.registerPlugin(ScrollTrigger);

        // --- SVG Components ---

        const TruckSVG = ({ className }) => (
            <svg viewBox="0 0 200 120" className={className}>
                <defs>
                    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stopColor="#222" />
                        <stop offset="50%" stopColor="#444" />
                        <stop offset="100%" stopColor="#111" />
                    </linearGradient>
                    <linearGradient id="cabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stopColor="#ff00cc" />
                        <stop offset="100%" stopColor="#3333ff" />
                    </linearGradient>
                </defs>
                {/* Wheels */}
                <circle cx="40" cy="100" r="15" fill="#111" stroke="#333" strokeWidth="2" />
                <circle cx="140" cy="100" r="15" fill="#111" stroke="#333" strokeWidth="2" />
                <circle cx="170" cy="100" r="15" fill="#111" stroke="#333" strokeWidth="2" />
                
                {/* Chassis */}
                <rect x="20" y="90" width="170" height="10" fill="#333" />
                
                {/* Cab */}
                <path d="M130,90 L130,40 L160,40 L190,60 L190,90 Z" fill="url(#cabGrad)" />
                <path d="M160,40 L190,60 L190,65 L160,45 Z" fill="#00ccff" opacity="0.5" />
                
                {/* Bed (The Container) */}
                <path d="M10,90 L10,30 L120,30 L120,90 Z" fill="url(#truckGrad)" stroke="#555" />
                <rect x="15" y="35" width="100" height="50" fill="none" stroke="#666" strokeDasharray="5,5" />
                
                {/* Logo on Truck */}
                <text x="65" y="65" fontSize="10" fill="white" textAnchor="middle" fontFamily="Orbitron">BLACK SHEEP</text>
            </svg>
        );

        const BoxSVG = ({ type, className }) => {
            const colors = ["#8B4513", "#A0522D", "#CD853F"]; // Brown shades
            const color = colors[type % colors.length];
            return (
                <svg viewBox="0 0 50 50" className={className}>
                    <rect x="5" y="10" width="40" height="35" fill={color} stroke="#3e2723" strokeWidth="1" />
                    <line x1="25" y1="10" x2="25" y2="45" stroke="#5d4037" strokeWidth="1" />
                    <line x1="5" y1="10" x2="15" y2="0" stroke="#5d4037" strokeWidth="1" />
                    <path d="M5,10 L15,0 L45,0 L35,10 Z" fill="#D2691E" />
                    <path d="M45,0 L45,35 L35,45" fill="none" stroke="#3e2723" strokeWidth="1" opacity="0.5" />
                </svg>
            );
        };

        const CouchSVG = ({ className }) => (
            <svg viewBox="0 0 100 60" className={className}>
                <rect x="10" y="30" width="80" height="20" fill="#555" rx="5" />
                <rect x="10" y="10" width="80" height="25" fill="#444" rx="5" />
                <rect x="0" y="25" width="15" height="25" fill="#333" rx="2" />
                <rect x="85" y="25" width="15" height="25" fill="#333" rx="2" />
                <line x1="30" y1="30" x2="30" y2="50" stroke="#333" strokeWidth="1" />
                <line x1="70" y1="30" x2="70" y2="50" stroke="#333" strokeWidth="1" />
            </svg>
        );

        const SheepMascotSVG = ({ className }) => (
            <svg viewBox="0 0 60 60" className={className}>
                <circle cx="30" cy="30" r="20" fill="black" stroke="white" strokeWidth="2" />
                <circle cx="25" cy="25" r="3" fill="red" />
                <circle cx="35" cy="25" r="3" fill="red" />
                <path d="M20,15 L15,5 M40,15 L45,5" stroke="white" strokeWidth="2" />
                <path d="M25,35 Q30,40 35,35" fill="none" stroke="white" strokeWidth="1" />
            </svg>
        );

        // --- Sections ---

        const Navbar = () => (
            <nav className="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center glass-panel">
                <a href="index.html" className="flex items-center gap-2 hover:opacity-80 transition-opacity cursor-pointer">
                    <SheepMascotSVG className="w-8 h-8 animate-pulse" />
                    <span className="font-orbitron text-xl font-bold tracking-widest text-white">BLACK SHEEP</span>
                </a>
                <div className="hidden md:flex gap-6 font-rajdhani font-bold text-lg">
                    <a href="#services" className="hover:text-cyan-400 transition-colors">HAULING</a>
                    <a href="#process" className="hover:text-cyan-400 transition-colors">PROCESS</a>
                    <a href="#contact" className="hover:text-cyan-400 transition-colors">BOOK NOW</a>
                </div>
                <button className="bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-white font-bold py-2 px-4 rounded-full font-orbitron text-sm transition-transform hover:scale-105">
                    1-(425) 517-9528
                </button>
            </nav>
        );

        const Hero = () => {
            const containerRef = useRef(null);
            const titleRef = useRef(null);
            const subRef = useRef(null);

            useEffect(() => {
                const ctx = gsap.context(() => {
                    gsap.from(titleRef.current, {
                        y: 100,
                        opacity: 0,
                        duration: 1.5,
                        ease: "power4.out"
                    });
                    gsap.from(subRef.current, {
                        y: 50,
                        opacity: 0,
                        duration: 1.5,
                        delay: 0.5,
                        ease: "power3.out"
                    });
                    
                    // Floating elements background
                    gsap.to(".floating-bg", {
                        y: "random(-20, 20)",
                        x: "random(-20, 20)",
                        rotation: "random(-15, 15)",
                        duration: "random(2, 4)",
                        repeat: -1,
                        yoyo: true,
                        ease: "sine.inOut",
                        stagger: 0.5
                    });
                }, containerRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={containerRef} className="relative h-screen w-full flex flex-col justify-center items-center overflow-hidden">
                    {/* Background Grid */}
                    <div className="absolute inset-0 z-0 opacity-20" 
                         style={{ 
                             backgroundImage: 'linear-gradient(rgba(0, 204, 255, 0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 204, 255, 0.3) 1px, transparent 1px)',
                             backgroundSize: '40px 40px',
                             transform: 'perspective(500px) rotateX(60deg) scale(2)',
                             transformOrigin: 'top center'
                         }}>
                    </div>
                    
                    {/* Decorative Blobs */}
                    <div className="absolute top-1/4 left-1/4 w-64 h-64 bg-purple-600 rounded-full mix-blend-screen filter blur-[80px] opacity-40 animate-pulse"></div>
                    <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600 rounded-full mix-blend-screen filter blur-[80px] opacity-40 animate-pulse" style={{animationDelay: '1s'}}></div>

                    <div className="z-10 text-center px-4">
                        <div ref={titleRef} className="font-orbitron font-black text-6xl md:text-8xl lg:text-9xl mb-4 leading-tight">
                            <span className="block text-white">The OFFICIAL</span>
                            <span className="block gradient-text">BLACK SHEEP Company</span>
                        </div>
                        <p ref={subRef} className="text-xl md:text-2xl text-gray-300 max-w-2xl mx-auto font-light tracking-wide">
                            FUTURISTIC JUNK REMOVAL & HAULING
                        </p>
                    </div>

                    {/* Floating Junk (Subtle) */}
                    <BoxSVG type={1} className="floating-bg absolute top-20 left-10 w-16 opacity-30" />
                    <BoxSVG type={2} className="floating-bg absolute bottom-32 right-10 w-24 opacity-30" />
                    <CouchSVG className="floating-bg absolute top-1/2 right-32 w-32 opacity-20" />

                    <div className="absolute bottom-10 animate-bounce">
                        <svg className="w-8 h-8 text-white opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                    </div>
                </section>
            );
        };

        const TheMess = () => {
            const sectionRef = useRef(null);
            
            useEffect(() => {
                const ctx = gsap.context(() => {
                    gsap.utils.toArray(".mess-item").forEach((item, i) => {
                        gsap.fromTo(item, 
                            { 
                                y: -100, 
                                opacity: 0,
                                rotation: Math.random() * 90 - 45
                            },
                            {
                                y: 0,
                                opacity: 1,
                                duration: 1,
                                ease: "bounce.out",
                                scrollTrigger: {
                                    trigger: sectionRef.current,
                                    start: "top 70%",
                                    end: "bottom 80%",
                                    toggleActions: "play reverse play reverse",
                                    scrub: 1
                                }
                            }
                        );
                    });
                }, sectionRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={sectionRef} id="services" className="min-h-screen relative flex flex-col items-center py-20 bg-zinc-900">
                    <h2 className="text-5xl md:text-7xl font-orbitron font-bold mb-20 text-center relative z-10">
                        <span className="text-red-500">THE MESS</span> IS REAL
                    </h2>
                    
                    <div className="relative w-full max-w-6xl h-[600px] border-2 border-dashed border-zinc-700 rounded-lg bg-zinc-800/50 overflow-hidden">
                        {/* A pile of junk */}
                        {[...Array(15)].map((_, i) => (
                            <div key={i} className="mess-item absolute" style={{
                                top: `${Math.random() * 60 + 20}%`,
                                left: `${Math.random() * 80 + 10}%`,
                                width: `${Math.random() * 100 + 50}px`,
                                zIndex: i
                            }}>
                                {i % 3 === 0 ? <CouchSVG className="w-full h-auto drop-shadow-2xl" /> : 
                                 <BoxSVG type={i} className="w-full h-auto drop-shadow-2xl" />}
                            </div>
                        ))}
                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                            <h3 className="text-9xl font-black text-white/5 font-orbitron">CLUTTER</h3>
                        </div>
                    </div>
                    
                    <div className="mt-12 max-w-2xl text-center px-6">
                        <p className="text-2xl text-gray-400">
                            Old furniture, appliances, debris, or just plain junk. 
                            It accumulates, taking up your space and peace of mind.
                        </p>
                    </div>
                </section>
            );
        };

        const TheSolution = () => {
            const sectionRef = useRef(null);
            const truckRef = useRef(null);
            const itemsRef = useRef(null);

            useEffect(() => {
                const ctx = gsap.context(() => {
                    const truckWidth = window.innerWidth < 768 ? 300 : 600;
                    // Calculate roughly where the bed of the truck is (left side of the truck SVG)
                    // The items start at left ~32px. We need to move them to Right side minus truck width.
                    const destinationX = window.innerWidth - truckWidth + (truckWidth * 0.2); 

                    const tl = gsap.timeline({
                        scrollTrigger: {
                            trigger: sectionRef.current,
                            start: "top top",
                            end: "+=2000",
                            scrub: true,
                            pin: true,
                            anticipatePin: 1
                        }
                    });

                    // 1. Truck backs in (from right off-screen to right edge)
                    tl.fromTo(truckRef.current, 
                        { x: "100vw" },
                        { x: "0%", duration: 2, ease: "power2.inOut" }
                    );

                    // 2. Items get sucked into truck
                    const items = gsap.utils.toArray(".junk-to-load");
                    items.forEach((item, i) => {
                        tl.to(item, {
                            x: destinationX, 
                            y: -150, // Arc up
                            scale: 0.1,
                            opacity: 0,
                            rotation: 720,
                            duration: 1,
                            ease: "back.in(1.2)"
                        }, "-=0.9");
                    });

                    // 3. Truck drives away (forward, off to the right)
                    tl.to(truckRef.current, {
                        x: "100vw",
                        duration: 1.5,
                        ease: "power2.in"
                    });

                    // 4. Reveal "Clean" text
                    tl.fromTo(".clean-text", 
                        { scale: 0, opacity: 0 },
                        { scale: 1.5, opacity: 1, duration: 1, ease: "elastic.out(1, 0.3)" },
                        "-=0.5"
                    );

                }, sectionRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={sectionRef} id="process" className="h-screen w-full relative bg-gradient-to-b from-zinc-900 to-black overflow-hidden flex items-center justify-center">
                    
                    {/* Background effects */}
                    <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiMzMzMiLz48L3N2Zz4=')] opacity-20"></div>

                    {/* The Junk Pile waiting to be loaded */}
                    <div ref={itemsRef} className="absolute left-10 md:left-32 bottom-20 md:bottom-1/3 flex flex-wrap w-64 md:w-96 gap-4">
                        {/* Refrigerator - largest item */}
                        <div className="junk-to-load relative">
                            <RefrigeratorSVG className="w-24 md:w-36 h-auto" />
                        </div>
                        {/* Couch - large item */}
                        <div className="junk-to-load relative">
                            <CouchSVG className="w-24 md:w-36 h-auto" />
                        </div>
                        {/* Boxes - smaller items */}
                        {Array.from({length: 20}, (_, i) => i + 1).map(i => (
                            <div key={i} className="junk-to-load relative">
                                <BoxSVG type={i % 3 || 1} className="w-16 md:w-24" />
                            </div>
                        ))}
                    </div>

                    {/* The Truck */}
                    <div ref={truckRef} className="absolute right-0 bottom-20 md:bottom-1/3 z-20 w-[300px] md:w-[600px]">
                         <TruckSVG className="w-full drop-shadow-[0_0_30px_rgba(0,204,255,0.5)]" />
                    </div>

                    {/* Clean Text */}
                    <div className="clean-text absolute text-center z-0">
                        <h2 className="text-6xl md:text-9xl font-orbitron font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600">
                            GONE.
                        </h2>
                        <p className="text-white text-xl font-rajdhani tracking-[0.5em]">LIKE IT NEVER HAPPENED</p>
                    </div>

                </section>
            );
        };

        const PricingCards = () => {
             const cardsRef = useRef(null);

             useEffect(() => {
                 const ctx = gsap.context(() => {
                     gsap.from(".pricing-card", {
                         y: 100,
                         opacity: 0,
                         stagger: 0.2,
                         duration: 1,
                         scrollTrigger: {
                             trigger: cardsRef.current,
                             start: "top 80%"
                         }
                     });
                 }, cardsRef);
                 return () => ctx.revert();
             }, []);

             const services = [
                 { title: "CURBSIDE PICKUP", icon: "📦", desc: "You leave it out, we make it disappear. Perfect for single items.", price: "STARTING AT $99" },
                 { title: "FULL ESTATE", icon: "🏠", desc: "Complete home cleanouts. We handle the heavy lifting from A to Z.", price: "CUSTOM QUOTE" },
                 { title: "CONSTRUCTION", icon: "🏗️", desc: "Debris removal for job sites. Keep your workflow clean and safe.", price: "BY WEIGHT" },
             ];

             return (
                 <section ref={cardsRef} className="py-24 px-6 bg-black relative">
                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 via-pink-500 to-red-500"></div>
                    <div className="max-w-7xl mx-auto">
                        <h2 className="text-4xl md:text-6xl font-orbitron text-center mb-16">OUR <span className="gradient-text">OPERATIONS</span></h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {services.map((s, i) => (
                                <div key={i} className="pricing-card glass-panel p-8 rounded-2xl hover:bg-white/10 transition-all cursor-pointer group border-t-4 border-transparent hover:border-cyan-400">
                                    <div className="text-6xl mb-6 group-hover:scale-110 transition-transform duration-300">{s.icon}</div>
                                    <h3 className="text-2xl font-bold font-orbitron mb-4 text-white group-hover:text-cyan-400">{s.title}</h3>
                                    <p className="text-gray-400 mb-6 font-rajdhani text-lg leading-relaxed">{s.desc}</p>
                                    <div className="text-xl font-bold text-cyan-300 font-orbitron">{s.price}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                 </section>
             );
        };

        const RefrigeratorSVG = ({ className }) => (
            <svg viewBox="0 0 60 100" className={className}>
                <defs>
                    <linearGradient id="fridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stopColor="#d1d5db" />
                        <stop offset="50%" stopColor="#f3f4f6" />
                        <stop offset="100%" stopColor="#9ca3af" />
                    </linearGradient>
                </defs>
                <rect x="5" y="2" width="50" height="96" rx="2" fill="url(#fridgeGrad)" stroke="#6b7280" strokeWidth="1" />
                <line x1="5" y1="35" x2="55" y2="35" stroke="#9ca3af" strokeWidth="1" />
                <rect x="8" y="10" width="4" height="20" rx="1" fill="#9ca3af" />
                <rect x="8" y="45" width="4" height="30" rx="1" fill="#9ca3af" />
                <rect x="35" y="40" width="12" height="15" fill="#e5e7eb" rx="1" />
                <rect x="38" y="43" width="6" height="8" fill="#4b5563" rx="0.5" />
                {/* Magnets/Details */}
                <circle cx="20" cy="20" r="2" fill="#ef4444" />
                <rect x="30" y="60" width="15" height="20" fill="white" opacity="0.5" transform="rotate(5 30 60)" />
            </svg>
        );

        const SheepHoard = () => {
            const containerRef = useRef(null);
            const hoardRef = useRef(null);

            useEffect(() => {
                const ctx = gsap.context(() => {
                    gsap.fromTo(hoardRef.current,
                        { x: "-50%" },
                        {
                            x: "100%",
                            ease: "none",
                            scrollTrigger: {
                                trigger: containerRef.current,
                                start: "top bottom",
                                end: "bottom top",
                                scrub: 25,
                                toggleActions: "play none none reverse"
                            }
                        }
                    );
                }, containerRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={containerRef} className="py-24 bg-zinc-900 overflow-hidden relative border-t border-zinc-800">
                    <div className="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none select-none">
                        <span className="text-[12vw] font-black font-orbitron text-white whitespace-nowrap">WE HAUL IT ALL</span>
                    </div>

                    <div ref={hoardRef} className="flex flex-col items-center w-max relative z-20">
                        {/* The Fridge tilted */}
                        <div className="relative z-10 mb-[-20px] transform -rotate-6 origin-bottom-left">
                            <RefrigeratorSVG className="w-48 md:w-64 h-auto drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)]" />
                        </div>
                        {/* The Sheep carrying it */}
                        <div className="flex gap-4 items-end">
                             {[...Array(5)].map((_, i) => (
                                <div key={i} className="relative">
                                    <SheepMascotSVG className="w-12 h-12 md:w-16 md:h-16 animate-bounce" style={{ animationDelay: `${i * 0.1}s`, animationDuration: '0.8s' }} />
                                    {/* Sweat drops */}
                                    <div className="absolute -top-4 -right-2 text-cyan-300 text-xs animate-ping" style={{ animationDelay: `${i * 0.2}s` }}>💦</div>
                                </div>
                             ))}
                        </div>
                    </div>
                </section>
            );
        };

        const BookingSection = () => {
            const [selectedDate, setSelectedDate] = useState(null);
            const days = Array.from({ length: 30 }, (_, i) => i + 1);

            return (
                <section id="book" className="py-24 px-4 bg-black text-center relative overflow-hidden">
                     {/* Decorative BG */}
                    <div className="absolute top-0 right-0 w-96 h-96 bg-cyan-900/20 rounded-full blur-[100px] pointer-events-none"></div>
                    <div className="absolute bottom-0 left-0 w-64 h-64 bg-pink-900/20 rounded-full blur-[80px] pointer-events-none"></div>

                    <h2 className="text-4xl md:text-6xl font-orbitron mb-4">SECURE YOUR <span className="gradient-text">SLOT</span></h2>
                    <p className="text-xl text-gray-400 font-rajdhani mb-12">Select a date for extraction.</p>
                    
                    <div className="max-w-4xl mx-auto glass-panel p-6 md:p-10 rounded-3xl relative z-10 border border-white/10 shadow-[0_0_50px_rgba(0,204,255,0.1)]">
                        <div className="flex justify-between items-center mb-8 font-orbitron border-b border-white/10 pb-4">
                            <button className="text-cyan-400 hover:text-white text-2xl transition-colors">&lt;</button>
                            <span className="text-2xl md:text-3xl font-bold tracking-widest text-white">January 2026</span>
                            <button className="text-cyan-400 hover:text-white text-2xl transition-colors">&gt;</button>
                        </div>
                        
                        <div className="grid grid-cols-7 gap-2 md:gap-4 mb-8">

        // Random Bible verses - loaded from external file
        async function setRandomBibleVerse() {
            try {
                const response = await fetch('few-verses.txt');
                const text = await response.text();
                const verses = text.split('\n').filter(line => line.trim() !== '');

                if (verses.length > 0) {
                    const randomVerse = verses[Math.floor(Math.random() * verses.length)];
                    document.getElementById('bible-verse').textContent = randomVerse;
                } else {
                    document.getElementById('bible-verse').textContent = "The Lord bless you and keep you. - Numbers 6:24";
                }
            } catch (error) {
                console.error('Error loading verses:', error);
                document.getElementById('bible-verse').textContent = "The Lord bless you and keep you. - Numbers 6:24";
            }
        }

        // Set random Bible verse on page load
        setTimeout(() => setRandomBibleVerse(), 100);
