<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Official Black Sheep Company</title>
    <style>
        /* Basic Page Styling */
        body { font-family: sans-serif; background: #1a1a1a; color: white; }
        
        /* The Modal (Background) */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.9);
        }

        /* Modal Content Box */
        .modal-content {
            background-color: #2c2c2c;
            margin: 5% auto;
            padding: 20px;
            width: 80%;
            max-width: 900px;
            border-radius: 10px;
            display: flex;
            height: 70vh;
        }

        /* Left Column (Checklist) */
        .sidebar {
            width: 25%;
            border-right: 1px solid #444;
            padding-right: 15px;
        }

        .policy-item {
            padding: 15px 5px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }

        .policy-item.active { background: #3d3d3d; }

        .check-mark {
            width: 20px;
            height: 20px;
            border: 2px solid #555;
            margin-right: 10px;
            display: inline-block;
            text-align: center;
            line-height: 20px;
            color: transparent;
        }

        .checked .check-mark {
            border-color: #4CAF50;
            color: #4CAF50;
        }

        /* Right Column (Content) */
        .content-area {
            width: 75%;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
        }

        .policy-text {
            flex-grow: 1;
            overflow-y: auto;
            background: #1e1e1e;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .accept-section {
            border-top: 1px solid #444;
            padding-top: 10px;
            text-align: right;
        }

        #finish-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: not-allowed;
            opacity: 0.5;
            font-weight: bold;
        }

        #finish-btn.enabled {
            cursor: pointer;
            opacity: 1;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" id="contact-link">Contact Us</a>
    </nav>

    <div id="policyModal" class="modal">
        <div class="modal-content">
            
            <div class="sidebar">
                <h3>Required Documents</h3>
                <div class="policy-item active" id="item-privacy" onclick="showPolicy('privacy')">
                    <span class="check-mark">✔</span> Privacy Policy
                </div>
                <div class="policy-item" id="item-terms" onclick="showPolicy('terms')">
                    <span class="check-mark">✔</span> Terms & Conditions
                </div>
                <div class="policy-item" id="item-refund" onclick="showPolicy('refund')">
                    <span class="check-mark">✔</span> Refund Policy
                </div>
            </div>

            <div class="content-area">
                <h2 id="policy-title">Privacy Policy</h2>
                <div class="policy-text" id="policy-body">
                    <p>This is the Privacy Policy for theofficialblacksheepcompany.com...</p>
                    <p>(Scroll to the bottom to accept this document)</p>
                    <div style="height: 400px;"></div> <p>END OF DOCUMENT.</p>
                </div>
                
                <div class="accept-section">
                    <label>
                        <input type="checkbox" id="current-check" onchange="toggleAccept()"> 
                        I have read and accept this document.
                    </label>
                </div>

                <div style="margin-top:20px;">
                    <button id="finish-btn" onclick="completeProcess()">Confirm & Approve All</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById("policyModal");
        const contactLink = document.getElementById("contact-link");
        const finishBtn = document.getElementById("finish-btn");
        
        let currentPolicy = 'privacy';
        const status = {
            privacy: false,
            terms: false,
            refund: false
        };

        const content = {
            privacy: { title: "Privacy Policy", text: "Your data is stored on our secure Fedora and Ubuntu servers..." },
            terms: { title: "Terms & Conditions", text: "Usage of our AI tools and barcode scanners is subject to..." },
            refund: { title: "Return & Refund", text: "All digital services are non-refundable once deployed..." }
        };

        // Open Modal
        contactLink.onclick = function(e) {
            e.preventDefault();
            modal.style.display = "block";
        }

        function showPolicy(key) {
            currentPolicy = key;
            // Update Active Class
            document.querySelectorAll('.policy-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`item-${key}`).classList.add('active');
            
            // Update Text
            document.getElementById('policy-title').innerText = content[key].title;
            document.getElementById('policy-body').innerHTML = `<p>${content[key].text}</p><div style="height:400px"></div><p>END OF DOCUMENT</p>`;
            
            // Sync Checkbox
            document.getElementById('current-check').checked = status[key];
        }

        function toggleAccept() {
            const isChecked = document.getElementById('current-check').checked;
            status[currentPolicy] = isChecked;
            
            // Update Sidebar UI
            const sidebarItem = document.getElementById(`item-${currentPolicy}`);
            if (isChecked) sidebarItem.classList.add('checked');
            else sidebarItem.classList.remove('checked');

            checkAllComplete();
        }

        function checkAllComplete() {
            const allDone = Object.values(status).every(v => v === true);
            if (allDone) {
                finishBtn.classList.add('enabled');
                finishBtn.disabled = false;
            } else {
                finishBtn.classList.remove('enabled');
                finishBtn.disabled = true;
            }
        }

        function completeProcess() {
            alert("All policies approved! Redirecting to contact form...");
            modal.style.display = "none";
            // Navigate to your actual contact page or section here
            // window.location.href = "/contact-form"; 
        }
    </script>
</body>
</html>
