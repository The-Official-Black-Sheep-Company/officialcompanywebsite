type User @table {
  displayName: String!
  email: String!
  photoUrl: String
}

type Website @table {
  user: User
  name: String!
  url: String!
  status: String!
  createdAt: Timestamp!
  description: String
}

type Category @table {
  user: User
  name: String!
}

type WebsiteCategory @table(key: ["website", "category"]) {
  website: Website!
  category: Category!
  createdAt: Timestamp!
}