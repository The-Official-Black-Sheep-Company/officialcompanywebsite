<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Official Black Sheep Company - Verbose Display</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@300&display=swap');

        :root {
            --gold-highlight: #fffbe6;
            --gold-light: #f7e98e;
            --gold-bright: #e8d067;
            --gold: #d4af37;
            --gold-mid: #b8942a;
            --gold-dark: #8b6914;
            --gold-shadow: #5c4310;
            --gold-deep: #3d2a08;
            --dark-bg: #050505;
            --wrapper-padding: 52px;
            --frame-inset: var(--wrapper-padding);
            --post-w: 72px;
            --post-overlap: 24px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(212, 175, 55, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
                radial-gradient(circle at center, #0a0a0a 0%, #000000 100%);
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .ornate-wrapper {
            position: relative;
            transition: all 0.5s ease-in-out;
            padding: var(--wrapper-padding);
            overflow: visible;
        }

        .box-mode-default {
            width: 1500px;
            height: 340px;
            max-width: 95vw;
        }

        .box-mode-large {
            width: 1200px;
            height: 800px;
            max-width: 95vw;
        }

        .box-mode-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            --wrapper-padding: 72px;
            --post-w: 88px;
            --post-overlap: 28px;
            z-index: 9999;
            background-color: var(--dark-bg);
        }

        /* ========================================
           HYPER-REALISTIC GOLD POSTS
           ======================================== */
        .frame-post {
            position: absolute;
            top: calc(var(--frame-inset) - 40px);
            height: calc(100% - (var(--frame-inset) * 2) + 80px);
            width: var(--post-w);
            z-index: 40;
            pointer-events: none;
            left: calc(var(--frame-inset) - var(--post-overlap) - var(--post-w));
            border-radius: 12px;
            
            /* Realistic cylindrical gold shading */
            background:
                /* Specular highlight streak */
                linear-gradient(90deg, 
                    transparent 0%,
                    transparent 15%,
                    rgba(255,255,255,0.35) 22%,
                    rgba(255,255,255,0.6) 28%,
                    rgba(255,255,255,0.35) 34%,
                    transparent 45%,
                    transparent 100%),
                /* Cylindrical shading */
                linear-gradient(90deg,
                    var(--gold-deep) 0%,
                    var(--gold-shadow) 8%,
                    var(--gold-dark) 15%,
                    var(--gold-mid) 25%,
                    var(--gold-bright) 35%,
                    var(--gold-light) 42%,
                    var(--gold-bright) 50%,
                    var(--gold-mid) 60%,
                    var(--gold-dark) 75%,
                    var(--gold-shadow) 88%,
                    var(--gold-deep) 100%),
                /* Vertical variation */
                linear-gradient(180deg,
                    rgba(255,255,255,0.15) 0%,
                    transparent 3%,
                    transparent 97%,
                    rgba(0,0,0,0.3) 100%);
            
            border: 1px solid var(--gold-dark);
            box-shadow:
                /* Outer glow */
                0 0 30px rgba(212,175,55,0.15),
                /* Deep shadow */
                8px 12px 40px rgba(0,0,0,0.8),
                -4px 8px 30px rgba(0,0,0,0.6),
                /* Inner edge highlights */
                inset 1px 0 0 rgba(255,255,255,0.3),
                inset -1px 0 0 rgba(0,0,0,0.5),
                inset 0 2px 0 rgba(255,255,255,0.2),
                inset 0 -2px 0 rgba(0,0,0,0.4);
        }

        /* Engraved pattern on posts */
        .frame-post::before {
            content: "";
            position: absolute;
            inset: 20px 8px;
            background: 
                repeating-linear-gradient(180deg,
                    transparent 0px,
                    transparent 18px,
                    rgba(0,0,0,0.15) 18px,
                    rgba(0,0,0,0.25) 20px,
                    rgba(255,255,255,0.1) 21px,
                    transparent 22px,
                    transparent 40px
                ),
                repeating-linear-gradient(180deg,
                    transparent 0px,
                    transparent 8px,
                    rgba(0,0,0,0.08) 9px,
                    rgba(255,255,255,0.05) 10px,
                    transparent 11px
                );
            border-radius: 6px;
            opacity: 0.7;
        }

        /* Post caps - top and bottom */
        .frame-post::after {
            content: "";
            position: absolute;
            left: -6px;
            right: -6px;
            height: 36px;
            top: -8px;
            border-radius: 10px;
            background:
                linear-gradient(180deg,
                    var(--gold-highlight) 0%,
                    var(--gold-light) 15%,
                    var(--gold) 40%,
                    var(--gold-dark) 70%,
                    var(--gold-shadow) 100%),
                linear-gradient(90deg,
                    rgba(0,0,0,0.3) 0%,
                    transparent 20%,
                    rgba(255,255,255,0.2) 50%,
                    transparent 80%,
                    rgba(0,0,0,0.3) 100%);
            border: 1px solid var(--gold-mid);
            box-shadow:
                0 4px 15px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.5),
                inset 0 -2px 4px rgba(0,0,0,0.4);
        }

        .frame-post-right {
            left: auto;
            right: calc(var(--frame-inset) - var(--post-overlap) - var(--post-w));
        }

        /* Bottom cap for posts */
        .post-cap-bottom {
            position: absolute;
            left: -6px;
            right: -6px;
            height: 36px;
            bottom: -8px;
            border-radius: 10px;
            background:
                linear-gradient(0deg,
                    var(--gold-highlight) 0%,
                    var(--gold-light) 15%,
                    var(--gold) 40%,
                    var(--gold-dark) 70%,
                    var(--gold-shadow) 100%),
                linear-gradient(90deg,
                    rgba(0,0,0,0.3) 0%,
                    transparent 20%,
                    rgba(255,255,255,0.2) 50%,
                    transparent 80%,
                    rgba(0,0,0,0.3) 100%);
            border: 1px solid var(--gold-mid);
            box-shadow:
                0 6px 20px rgba(0,0,0,0.8),
                inset 0 -1px 0 rgba(255,255,255,0.3),
                inset 0 2px 4px rgba(0,0,0,0.4);
        }

        /* ========================================
           HYPER-REALISTIC DISPLAY BOX FRAME
           ======================================== */
        .display-box {
            position: relative;
            width: 100%;
            height: 100%;
            border: 18px solid transparent;
            border-radius: 4px;
            background:
                /* Inner screen */
                radial-gradient(ellipse at 50% 30%, #1a1a1a 0%, #0a0a0a 50%, #050505 100%) padding-box,
                /* Multi-layer gold frame */
                linear-gradient(135deg,
                    var(--gold-highlight) 0%,
                    var(--gold-light) 8%,
                    var(--gold) 18%,
                    var(--gold-dark) 32%,
                    var(--gold-light) 45%,
                    var(--gold-highlight) 50%,
                    var(--gold-light) 55%,
                    var(--gold-dark) 68%,
                    var(--gold) 82%,
                    var(--gold-light) 92%,
                    var(--gold-highlight) 100%) border-box;
            box-shadow:
                /* Outer ambient glow */
                0 0 60px rgba(212,175,55,0.12),
                /* Main drop shadow */
                0 25px 80px rgba(0,0,0,0.85),
                12px 12px 40px rgba(0,0,0,0.7),
                /* Frame edge definition */
                inset 0 0 0 1px rgba(255,255,255,0.15),
                inset 0 0 0 3px rgba(0,0,0,0.6),
                /* Inner shadow for depth */
                inset 0 0 100px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Animated light reflection on frame */
        .display-box::before {
            content: "";
            position: absolute;
            inset: -18px;
            pointer-events: none;
            z-index: 100;
            background: linear-gradient(
                105deg,
                transparent 0%,
                transparent 35%,
                rgba(255,255,255,0.08) 45%,
                rgba(255,255,255,0.15) 50%,
                rgba(255,255,255,0.08) 55%,
                transparent 65%,
                transparent 100%
            );
            animation: shimmer 8s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translateX(-100%) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: translateX(100%) rotate(0deg); opacity: 1; }
            60% { opacity: 0; }
        }

        /* Inner frame bevel */
        .display-box::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            border: 3px solid transparent;
            border-radius: 2px;
            background: linear-gradient(135deg, 
                rgba(255,255,255,0.1) 0%, 
                transparent 50%, 
                rgba(0,0,0,0.3) 100%) border-box;
            box-shadow:
                inset 2px 2px 4px rgba(0,0,0,0.8),
                inset -1px -1px 2px rgba(255,255,255,0.05);
        }

        /* ========================================
           ORNATE CROWN - HYPER REALISTIC
           ======================================== */
        .ornament-top {
            position: absolute;
            top: calc(var(--frame-inset) - 100px);
            left: 50%;
            transform: translateX(-50%);
            width: 520px;
            height: 160px;
            z-index: 60;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .crown-plinth {
            position: absolute;
            bottom: 0;
            width: 400px;
            height: 56px;
            border-radius: 28px 28px 16px 16px;
            background:
                /* Top highlight */
                linear-gradient(180deg, 
                    rgba(255,255,255,0.4) 0%, 
                    rgba(255,255,255,0.1) 8%,
                    transparent 20%),
                /* Main gold gradient */
                linear-gradient(90deg,
                    var(--gold-deep) 0%,
                    var(--gold-shadow) 5%,
                    var(--gold-dark) 12%,
                    var(--gold) 25%,
                    var(--gold-light) 40%,
                    var(--gold-highlight) 50%,
                    var(--gold-light) 60%,
                    var(--gold) 75%,
                    var(--gold-dark) 88%,
                    var(--gold-shadow) 95%,
                    var(--gold-deep) 100%);
            border: 2px solid var(--gold-mid);
            box-shadow:
                0 20px 50px rgba(0,0,0,0.9),
                0 8px 25px rgba(0,0,0,0.7),
                0 0 30px rgba(212,175,55,0.2),
                inset 0 2px 0 rgba(255,255,255,0.3),
                inset 0 -4px 8px rgba(0,0,0,0.5);
        }

        .crown-plinth::before {
            content: "";
            position: absolute;
            inset: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.3);
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(0,0,0,0.15) 20%,
                rgba(255,255,255,0.08) 50%,
                rgba(0,0,0,0.15) 80%,
                transparent 100%);
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.15),
                inset 0 -1px 0 rgba(0,0,0,0.3);
        }

        .crown-svg {
            width: 260px;
            height: 130px;
            margin-bottom: 12px;
            filter:
                drop-shadow(0 20px 30px rgba(0,0,0,0.9))
                drop-shadow(0 0 20px rgba(212,175,55,0.25));
        }

        /* ========================================
           DECORATIVE FILIGREE
           ======================================== */
        .frame-filagree {
            position: absolute;
            width: 260px;
            height: 100px;
            z-index: 45;
            pointer-events: none;
            left: 50%;
            transform: translateX(-50%);
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.8));
        }

        .frame-filagree-top {
            top: calc(var(--frame-inset) - 58px);
        }

        .frame-filagree-bottom {
            bottom: calc(var(--frame-inset) - 58px);
            transform: translateX(-50%) rotate(180deg);
        }

        /* ========================================
           ORNATE CORNERS
           ======================================== */
        .corner {
            position: absolute;
            width: 110px;
            height: 110px;
            z-index: 55;
            pointer-events: none;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.8));
        }
        .corner svg { width: 100%; height: 100%; }
        .corner-tl { top: -28px; left: -28px; }
        .corner-tr { top: -28px; right: -28px; transform: rotate(90deg); }
        .corner-bl { bottom: -28px; left: -28px; transform: rotate(-90deg); }
        .corner-br { bottom: -28px; right: -28px; transform: rotate(180deg); }

        /* ========================================
           HANGING CHAINS & PENDANTS
           ======================================== */
        .chain {
            position: absolute;
            width: 6px;
            z-index: 35;
            left: 50%;
            transform: translateX(-50%);
            background:
                repeating-linear-gradient(180deg,
                    var(--gold-light) 0px,
                    var(--gold-dark) 2px,
                    var(--gold-shadow) 4px,
                    transparent 4px,
                    transparent 8px
                );
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.8));
            border-radius: 3px;
        }

        .chain::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                rgba(0,0,0,0.4) 0%,
                transparent 30%,
                rgba(255,255,255,0.3) 50%,
                transparent 70%,
                rgba(0,0,0,0.4) 100%);
        }

        .chain-left { top: calc(100% - var(--wrapper-padding)); height: 100px; left: 10%; }
        .chain-right { top: calc(100% - var(--wrapper-padding)); height: 100px; left: 90%; }
        .chain-mid-left { top: calc(100% - var(--wrapper-padding)); height: 70px; left: 28%; }
        .chain-mid-right { top: calc(100% - var(--wrapper-padding)); height: 70px; left: 72%; }

        .dangle {
            position: absolute;
            width: 28px;
            height: 42px;
            bottom: -44px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
            background:
                /* Specular highlight */
                radial-gradient(ellipse at 30% 25%, 
                    rgba(255,255,255,0.7) 0%, 
                    rgba(255,255,255,0.3) 20%,
                    transparent 50%),
                /* Main gold shading */
                linear-gradient(135deg,
                    var(--gold-light) 0%,
                    var(--gold) 30%,
                    var(--gold-dark) 60%,
                    var(--gold-shadow) 100%);
            border: 1px solid var(--gold-mid);
            box-shadow:
                0 8px 20px rgba(0,0,0,0.8),
                0 0 15px rgba(212,175,55,0.2),
                inset 0 -4px 8px rgba(0,0,0,0.5),
                inset 0 2px 4px rgba(255,255,255,0.3);
            animation: sway 4s ease-in-out infinite alternate;
            transform-origin: top center;
        }

        .jewel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 16px;
            border-radius: 50%;
            background:
                radial-gradient(ellipse at 30% 30%, 
                    rgba(255,255,255,0.9) 0%, 
                    rgba(255,255,255,0.4) 30%,
                    transparent 60%),
                radial-gradient(ellipse at 70% 70%,
                    rgba(0,0,0,0.5) 0%,
                    transparent 50%),
                linear-gradient(135deg, #fff 0%, var(--gold-light) 40%, var(--gold-dark) 100%);
            box-shadow:
                0 2px 6px rgba(0,0,0,0.6),
                0 0 10px rgba(212,175,55,0.4),
                inset 0 1px 2px rgba(255,255,255,0.8);
        }

        @keyframes sway {
            0% { transform: translateX(-50%) rotate(-4deg); }
            100% { transform: translateX(-50%) rotate(4deg); }
        }

        /* ========================================
           HEADER & CONTENT AREAS
           ======================================== */
        .header-plate {
            position: relative;
            z-index: 10;
            background:
                linear-gradient(180deg, 
                    rgba(40,40,40,1) 0%, 
                    rgba(15,15,15,1) 100%);
            border-bottom: 2px solid var(--gold-shadow);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.8),
                0 4px 12px rgba(0,0,0,0.5);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-plate::before {
            content: "";
            position: absolute;
            bottom: -3px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--gold-dark) 20%,
                var(--gold-light) 50%,
                var(--gold-dark) 80%,
                transparent 100%);
        }

        .company-name {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
        }

        .company-title {
            background: linear-gradient(180deg, 
                var(--gold-highlight) 0%, 
                var(--gold) 50%, 
                var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .controls { display: flex; gap: 12px; }

        .control-btn {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 1px solid var(--gold-shadow);
            color: var(--gold);
            font-family: 'Fira Code', monospace;
            cursor: pointer;
            padding: 8px 14px;
            font-size: 11px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 4px;
            box-shadow:
                0 2px 6px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .control-btn:hover {
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
            color: #000;
            border-color: var(--gold-light);
            box-shadow:
                0 0 20px rgba(212,175,55,0.3),
                0 4px 12px rgba(0,0,0,0.5);
        }

        .content-area {
            position: relative;
            z-index: 10;
            flex-grow: 1;
            padding: 20px 24px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            color: #c8d0d8;
            font-size: 12px;
            line-height: 1.6;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(30,30,30,0.5) 0%, transparent 60%),
                linear-gradient(180deg, rgba(10,10,10,1) 0%, rgba(5,5,5,1) 100%);
        }

        /* CRT Scanlines */
        .content-area::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 1px,
                    rgba(0,0,0,0.3) 1px,
                    rgba(0,0,0,0.3) 2px
                );
            pointer-events: none;
            z-index: 20;
            opacity: 0.6;
        }

        /* Vignette effect */
        .content-area::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            z-index: 21;
        }

        .verbose-text { color: #9aa8b8; }
        .verbose-highlight { color: var(--gold-light); text-shadow: 0 0 8px rgba(212,175,55,0.3); }
        .verbose-error { color: #ff5555; text-shadow: 0 0 8px rgba(255,50,50,0.3); }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 16px;
            background: var(--gold-light);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            box-shadow: 0 0 12px rgba(212,175,55,0.5);
        }

        @keyframes blink { 50% { opacity: 0; } }

        .content-area::-webkit-scrollbar { width: 10px; }
        .content-area::-webkit-scrollbar-track { 
            background: #0a0a0a; 
            border-left: 1px solid #222;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 50%, var(--gold-shadow) 100%);
            border-radius: 5px;
            border: 1px solid var(--gold-dark);
        }

        /* Side decorations in content */
        .side-accent {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 60%;
            background: linear-gradient(180deg,
                transparent 0%,
                var(--gold-shadow) 20%,
                var(--gold) 50%,
                var(--gold-shadow) 80%,
                transparent 100%);
            opacity: 0.4;
            border-radius: 2px;
        }
        .side-accent-left { left: 8px; }
        .side-accent-right { right: 8px; }

        /* Responsive */
        @media (max-width: 800px) {
            .ornament-top { width: 360px; }
            .crown-plinth { width: 300px; height: 48px; }
            .crown-svg { width: 200px; height: 100px; }
            .frame-filagree { width: 200px; }
            :root { --post-w: 50px; }
        }
    </style>
</head>
<body>

<div id="wrapper" class="ornate-wrapper box-mode-default">

    <!-- CROWN ORNAMENT -->
    <div class="ornament-top" aria-hidden="true">
        <div class="crown-plinth"></div>
        <svg class="crown-svg" viewBox="0 0 260 150" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Hyper-realistic gold gradient -->
                <linearGradient id="crownGold" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#fffbe6"/>
                    <stop offset="15%" stop-color="#f7e98e"/>
                    <stop offset="35%" stop-color="#d4af37"/>
                    <stop offset="50%" stop-color="#8b6914"/>
                    <stop offset="65%" stop-color="#d4af37"/>
                    <stop offset="85%" stop-color="#f7e98e"/>
                    <stop offset="100%" stop-color="#fffbe6"/>
                </linearGradient>
                <linearGradient id="crownHighlight" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
                    <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
                    <stop offset="70%" stop-color="#000000" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
                </linearGradient>
                <linearGradient id="crownBase" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#3d2a08"/>
                    <stop offset="10%" stop-color="#8b6914"/>
                    <stop offset="30%" stop-color="#d4af37"/>

<script>
    const wrapper = document.getElementById('wrapper');
    const output = document.getElementById('terminal-output');
    let isLarge = false;
    let isFullscreen = false;

    const cursorLine = document.createElement('div');
    cursorLine.className = 'mt-2';
    cursorLine.innerHTML = '<span style="color: var(--gold-light);">▶</span> <span class="cursor"></span>';
    output.appendChild(cursorLine);

    function ensureCursorBottom() {
        if (cursorLine.parentElement === output) output.appendChild(cursorLine);
    }

    function toggleSize() {
        if (isFullscreen) return;
        isLarge = !isLarge;
        wrapper.classList.remove('box-mode-default', 'box-mode-large');
        wrapper.classList.add(isLarge ? 'box-mode-large' : 'box-mode-default');
    }

    function toggleFullscreen() {
        isFullscreen = !isFullscreen;
        if (isFullscreen) {
            wrapper.dataset.prevClass = isLarge ? 'box-mode-large' : 'box-mode-default';
            wrapper.classList.remove('box-mode-default', 'box-mode-large');
            wrapper.classList.add('box-mode-fullscreen');
        } else {
            wrapper.classList.remove('box-mode-fullscreen');
            wrapper.classList.add(wrapper.dataset.prevClass || 'box-mode-default');
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isFullscreen) toggleFullscreen();
    });

    function clearLog() {
        output.innerHTML = '';
        output.appendChild(cursorLine);
        addLog('[SYSTEM]', 'Log cleared successfully.', 'highlight');
    }

    function addLog(prefix, message, type = 'normal') {
        const line = document.createElement('div');
        line.className = 'mb-1';
        let colorClass = type === 'highlight' ? 'verbose-highlight' : type === 'error' ? 'verbose-error' : 'verbose-text';
        const time = new Date().toLocaleTimeString('en-US', { hour12: false }) + '.' + String(Math.floor(Math.random() * 1000)).padStart(3, '0');
        line.innerHTML = `<span style="opacity:0.4">[${time}]</span> <span class="${colorClass}">${prefix}</span> <span class="verbose-text">${message}</span>`;
        if (cursorLine.parentElement === output) {
            output.insertBefore(line, cursorLine);
        } else {
            output.appendChild(line);
        }
        output.scrollTop = output.scrollHeight;
        ensureCursorBottom();
    }

    // Track last seen items to detect new scans
    let lastStagingCount = 0;
    let lastInventoryCount = 0;
    let lastScannedUPC = null;

    // Fetch staging items to monitor new scans
    async function fetchStagingItems() {
        try {
            // Always use HTTPS since the API server only runs on HTTPS
            const response = await fetch('https://10.0.0.249:8443/api/staging/list');
            const data = await response.json();

            if (data.status === 'success' && data.items) {
                const currentCount = data.items.length;

                // New item added to staging
                if (currentCount > lastStagingCount) {
                    const newItem = data.items[0]; // Most recent is first

                    if (newItem.upc !== lastScannedUPC) {
                        lastScannedUPC = newItem.upc;

                        // Header for new scan
                        addLog('[═══════]', '═══════════════════════════════════════', 'highlight');
                        addLog('[🔍 SCAN]', `UPC: ${newItem.upc}`, 'highlight');
                        addLog('[📦 PRODUCT]', `${newItem.product_name || 'Unknown Product'}`, 'normal');

                        // Core fields
                        addLog('[🐑 BLACKSHEEP]', `#${newItem.blacksheep || 'N/A'}`, 'normal');
                        addLog('[💰 PRICE]', `$${newItem.price || '0.00'}`, 'highlight');
                        addLog('[📍 LOCATION]', `${newItem.location || 'Not set'}`, 'normal');

                        // Additional product details (fetch from API for more info)
                        fetchItemDetails(newItem.id).then(details => {
                            if (details) {
                                if (details.weight && details.weight_unit) {
                                    addLog('[⚖️  WEIGHT]', `${details.weight} ${details.weight_unit}`, 'normal');
                                }
                                if (details.brand) {
                                    addLog('[🏷️  BRAND]', `${details.brand}`, 'normal');
                                }
                                if (details.category) {
                                    addLog('[📂 CATEGORY]', `${details.category}`, 'normal');
                                }
                            }
                        });

                        // Media information
                        if (newItem.photo_count > 0) {
                            addLog('[📸 MEDIA]', `${newItem.photo_count} photo(s) captured`, 'highlight');
                        }
                        if (newItem.has_video) {
                            addLog('[🎥 VIDEO]', `Video captured`, 'highlight');
                        }

                        // Timestamps
                        if (newItem.scanned_at) {
                            addLog('[🕐 SCANNED]', `${newItem.scanned_at}`, 'normal');
                        }
                        if (newItem.date_listed) {
                            addLog('[📅 LISTED]', `${newItem.date_listed}`, 'normal');
                        }

                        addLog('[✓ STATUS]', `Added to staging - ID: ${newItem.id}`, 'normal');
                        addLog('[═══════]', '═══════════════════════════════════════', 'normal');
                    }
                }

                lastStagingCount = currentCount;
            }
        } catch (error) {
            console.error('Staging fetch error:', error);
            if (Math.random() > 0.95) { // Only show errors occasionally
                addLog('[⚠ ERROR]', `Connection issue: ${error.message}`, 'error');
            }
        }
    }

    // Fetch inventory to monitor imports
    async function fetchInventory() {
        try {
            // Always use HTTPS since the API server only runs on HTTPS
            const response = await fetch('https://10.0.0.249:8443/api/inventory/all');
            const data = await response.json();

            if (data.status === 'success' && data.items) {
                const currentCount = data.items.length;

                // New item imported to inventory
                if (currentCount > lastInventoryCount) {
                    const diff = currentCount - lastInventoryCount;
                    addLog('[✓ IMPORT]', `${diff} item(s) moved to inventory`, 'highlight');
                }

                lastInventoryCount = currentCount;
            }
        } catch (error) {
            console.error('Inventory fetch error:', error);
            // Silent fail for inventory checks
        }
    }

    // Fetch detailed item information
    async function fetchItemDetails(itemId) {
        try {
            // For now, we'll rely on the staging list data
            // Could be enhanced with a dedicated API endpoint for item details
            return null;
        } catch (error) {
            return null;
        }
    }

    // Display system status
    function showSystemStatus() {
        addLog('[ SYSTEM ]', `Monitoring scanner activity...`, 'normal');
        addLog('[ STATUS ]', `Staging items: ${lastStagingCount} | Inventory items: ${lastInventoryCount}`, 'normal');
    }

    // Poll for new scans every 2 seconds
    setInterval(fetchStagingItems, 2000);
    setInterval(fetchInventory, 5000);
    setInterval(showSystemStatus, 30000);

    // Initial fetch with detailed logging
    addLog('[ INIT ]', 'Connecting to scanner server at 10.0.0.249:8443...', 'highlight');
    console.log('Scanner Display: Starting initialization...');
    console.log('Scanner Display: Protocol is', window.location.protocol);

    setTimeout(() => {
        console.log('Scanner Display: Fetching initial data...');
        fetchStagingItems().then(() => {
            console.log('Scanner Display: Initial staging fetch complete');
            addLog('[ DEBUG ]', `Found ${lastStagingCount} items in staging`, 'normal');
        });
        fetchInventory().then(() => {
            console.log('Scanner Display: Initial inventory fetch complete');
            addLog('[ DEBUG ]', `Found ${lastInventoryCount} items in inventory`, 'normal');
        });
        addLog('[ READY ]', 'Scanner display active - monitoring for scans', 'highlight');
    }, 1000);

    setInterval(ensureCursorBottom, 1000);
</script>
